<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake & Ladder Game - Version 2.0</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Snake &amp; Ladder Game <small>v2.0</small></h1>
<div id="setup">
  <label>Number of players</label>
  <select id="count"><option>2</option><option>3</option><option>4</option></select>
  <div id="nameBox"></div>
  <button id="startBtn">Start Game</button>
</div>
<div id="game" class="hidden">
  <div id="status"></div>
  <div id="wrap">
    <div id="board"><svg id="lines" viewBox="0 0 100 100"></svg></div>
    <div id="panel">
      <div id="dice">🎲</div>
      <button id="rollBtn">Roll Dice</button>
      <button id="restartBtn">Restart</button>
      <h3>Players</h3><div id="info"></div>
      <h3>Race to 100</h3><div id="leader"></div>
      <div id="progress"><div id="bar"></div></div>
      <h3>Recent Moves</h3><ul id="history"></ul>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body></html>
